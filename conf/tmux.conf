# Frollo tmux config — Notre-Dame de Paris
# Não herda ~/.tmux.conf. Isolado por design.

# Terminal
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Sem delay no Escape (importante pro nvim)
set -sg escape-time 0

# Numeração a partir de 1
set -g base-index 1
set -g pane-base-index 1

# Mouse
set -g mouse on

# Histórico
set -g history-limit 10000

set -g set-titles off

# ── Status bar ──────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-style "bg=#0d0d0d,fg=#c8a45a"
set -g status-justify left

# Esquerda: ▲▲▲  frollo  ·  sessão
set -g status-left-length 50
set -g status-left "#[fg=#cc5500,bold]▲▲▲ #[fg=#c8a45a,nobold]frollo  "

# Direita: Notre-Dame  ·  data  hora
set -g status-right-length 60
set -g status-right "  #[fg=#9e9690]⚜  Notre-Dame#[fg=#8b3300] · #[fg=#c8a45a]%d/%m  #[fg=#cc5500,bold]%H:%M  "

# Janelas
set -g window-status-separator      ""
set -g window-status-format         "#[fg=#555555,bg=#0d0d0d]  #W  "
set -g window-status-current-format "#[fg=#cc5500,bg=#0d0d0d,bold]  #W  #[none]"

# ── Pane labels ─────────────────────────────────────────────────────────────
set -g pane-border-status top
set -g pane-border-format "#[none]#{?pane_active,#[fg=#cc5500],#[fg=#3d3d3d]} #{pane_title} #[none]"
set -g pane-border-style        "fg=#3d3d3d"
set -g pane-active-border-style "fg=#8b3300"

# ── Mensagens ───────────────────────────────────────────────────────────────
set -g message-style "bg=#1a1a1a,fg=#cc5500"

# ── Keybindings ─────────────────────────────────────────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
